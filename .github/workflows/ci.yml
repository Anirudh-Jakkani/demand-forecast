name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint + fast tests + CLI smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check src tests dashboard
      - name: Fast tests
        run: uv run pytest -m "not slow" -q
      - name: CLI smoke test (synthetic data -> ingest -> backtest)
        run: |
          uv run forecast make-sample --days 400
          uv run forecast ingest
          uv run forecast backtest -m seasonal_naive -m lightgbm --no-mlflow

  slow-tests:
    name: Registry, API, Prefect flow and replay tests
    needs: lint-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest -m slow -q

  docker:
    name: Docker image + compose smoke test
    needs: lint-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Validate compose file
        run: docker compose config --quiet

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha

      - name: Build image (load locally for the smoke test)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: demand-forecast-mlops:local
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start infrastructure (Postgres, MLflow, Prefect)
        run: docker compose up -d --no-build --wait --wait-timeout 300 postgres mlflow prefect-server

      - name: Bootstrap (sample data, ingest, train the first champion)
        run: docker compose run --rm --no-deps bootstrap

      - name: Start the app services
        run: docker compose up -d --no-build --no-deps api worker dashboard

      - name: Wait for the API to serve a model
        run: |
          for i in $(seq 1 60); do
            if curl -fsS localhost:8000/health | grep -q '"model_loaded":true'; then
              echo "API is serving a model"; exit 0
            fi
            sleep 5
          done
          echo "timed out waiting for the API"; exit 1

      - name: Smoke-test the API, MLflow, Prefect and dashboard
        run: |
          curl -fsS localhost:8000/model-info
          curl -fsS -X POST localhost:8000/predict -H "Content-Type: application/json" \
            -d '{"items":[{"store_id":"CA_1","item_id":"FOODS_1_001"}],"horizon":7}' \
            | tee /tmp/predict.json
          python3 -c "import json; d=json.load(open('/tmp/predict.json')); assert len(d['forecasts'][0]['forecast']) == 7"
          curl -fsS localhost:5000/health
          curl -fsS localhost:4200/api/health
          curl -fsS localhost:8501/_stcore/health

      - name: Logs on failure
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail 200
          # Also publish each container's state and log tail as annotations, which are
          # readable through the public API without signing in.
          esc() { tr -d '\r' | sed -e 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}'; }
          echo "::error title=compose ps::$(docker compose ps -a --format '{{.Service}} {{.State}} {{.Status}}' | esc)"
          for svc in $(docker compose ps -a --services); do
            echo "::error title=logs: $svc::$(docker compose logs --no-color --no-log-prefix --tail 40 "$svc" 2>&1 | esc)"
          done

      - name: Stop the stack
        if: always()
        run: docker compose down -v

      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image on version tags
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
