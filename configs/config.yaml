data:
  raw_dir: data/raw              # M5 CSVs: sales_train_evaluation.csv, calendar.csv, sell_prices.csv
  processed_path: data/processed/m5_ca_foods.parquet
  state: CA
  category: FOODS
  start_date: "2013-01-01"       # trim early history to keep memory modest

backtest:
  horizon: 28                    # days forecast per fold (M5 standard)
  n_folds: 4                     # rolling-origin folds, stepping back `step` days each
  step: 28

models:                          # constructor kwargs per model; omitted ones use defaults
  seasonal_naive:
    season: 7
  moving_average:
    window: 28
  lightgbm:
    num_boost_round: 600
    train_days: 730              # fit on the last 2 years per fold (features use older history)
    learning_rate: 0.05
    num_leaves: 127
    tweedie_variance_power: 1.1

mlflow:
  tracking_uri: sqlite:///mlflow.db
  experiment: m5-demand-forecast
  artifact_root: mlruns

registry:
  model_name: m5-demand-forecaster
  min_improvement: 0.01          # a new recipe must beat the champion's WAPE by >= 1%

serving:
  prediction_log: data/predictions.sqlite   # every served forecast, for monitoring later
  reload_interval_s: 60          # how often the API checks for a new champion

monitoring:
  window_days: 7                 # score live forecasts on the last 7 days of actuals
  min_points: 100
  max_wape_ratio: 1.25           # retrain if live WAPE > 1.25x the backtest WAPE
  drift_window_days: 28
  drift_share_threshold: 0.5     # retrain if >= half the monitored columns drifted
  target_drift_trigger: true     # ...or if the target (sales) drifts on its own
  target_column: sales
  drift_cooldown_days: 7         # a fresh model gets a week before drift can retrain it again
  max_model_age_days: 35
  db_path: data/monitoring.sqlite
  reports_dir: reports           # Evidently HTML drift reports

schedule:                        # used by `forecast pipeline serve`
  training_cron: "0 3 * * 1"     # weekly, Monday 03:00
  monitoring_cron: "0 6 * * *"   # daily 06:00
  timezone: UTC
